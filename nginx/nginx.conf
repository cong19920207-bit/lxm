# 林小梦 AI 虚拟人 - Nginx 配置
# 托管前端静态资源，反向代理 /api 到 Backend
# 安全（N8）：access_log / log_format 禁止记录 $http_authorization，避免 API Key / JWT 落盘

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    # Docker DNS: backend recreation must not leave workers using the old IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $voice_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        set $backend_endpoint http://backend:8000;

        # 根路径重定向到首页
        location = / {
            return 302 /pages/index.html;
        }

        # 前端静态：/pages/、/static/ 由 root 自动处理

        # 首页与未带内容摘要的场景模块每次重验证，确保回退开关及新代码可获取。
        location = /pages/index.html {
            try_files $uri =404;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-cache";
        }

        location = /pages/settings.html {
            try_files $uri =404;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-cache";
        }

        location ~ "^/static/(js/(home-data|home-preferences|home-scene-core|home-scene|bgm-preferences|bgm-settings|bgm-controller|bgm-output|bgm-catalog|bgm-player|bgm-session|bgm-page|bgm-record|bgm-home|bgm-bubble|bgm-ducking|bgm-media|bgm-preparation|voice-entry)\.js|css/(home-scene|bgm)\.css)$" {
            try_files $uri =404;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-cache";
        }

        # 仅本次首页带内容摘要的图片长期缓存；manifest、旧图和其他静态资源不变。
        location ~ "^/static/images/(home-scene/v4|home-thumbnails/v2)/[^/]+\.[0-9a-f]{12}\.(webp|jpg)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 管理后台：页面与 /admin/static 由 FastAPI 提供，统一反代到 Backend
        location /admin {
            proxy_pass $backend_endpoint;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Voice HTTP + initial/reconnect WebSocket use the same single backend owner.
        location /api/voice/ {
            proxy_pass $backend_endpoint;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $voice_connection_upgrade;
            # 同域校验需要保留浏览器实际访问的端口。
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # BGM raw media is a separate request from the optional cover. This
        # limit includes exactly 100 MiB; the app enforces the absolute budget.
        location ~ ^/api/admin/bgm/operations/[0-9a-f-]+/content$ {
            client_max_body_size 100m;
            client_body_timeout 120s;
            proxy_pass $backend_endpoint;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_send_timeout 130s;
            proxy_read_timeout 310s;
            proxy_connect_timeout 10s;
        }

        # API 反向代理到 Backend
        location /api/ {
            proxy_pass $backend_endpoint;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式对话需关闭缓冲，保持长连接
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            chunked_transfer_encoding off;
        }
    }
}
