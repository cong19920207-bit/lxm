<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三方服务监控 - 林小梦管理后台</title>
  <link rel="stylesheet" href="/admin/static/css/admin-common.css?v=observer-v1-20260716">
  <style>
    [hidden] { display: none !important; }
    #service-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .tp-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .tp-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .tp-card-title {
      font-size: 15px;
      font-weight: 600;
    }

    .tp-status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .tp-status-dot.normal { background: #52c41a; }
    .tp-status-dot.warning { background: #faad14; }
    .tp-status-dot.error { background: #ff4d4f; }
    .tp-status-dot.unknown { background: #d9d9d9; }

    .tp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #f8f8f8;
    }

    .tp-row:last-child {
      border-bottom: none;
    }

    .tp-progress-wrap {
      flex: 1;
      margin: 0 10px;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .tp-progress-fill {
      height: 100%;
      border-radius: 3px;
    }

    .tp-card-foot {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    #service-grid .skeleton {
      height: 200px;
      border-radius: 8px;
    }

    #bm25-capability { margin-bottom: 16px; }
    .bm25-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
    .bm25-grid .tp-row { gap: 16px; align-items: flex-start; }
    .bm25-grid .tp-row > span:first-child { flex-shrink: 0; color: #666; }
    .bm25-grid .tp-row > span:last-child { text-align: right; overflow-wrap: anywhere; }
    .bm25-version { margin-top: 12px; font-size: 12px; color: #888; overflow-wrap: anywhere; }
    .bm25-note { margin: 10px 0 0; font-size: 12px; line-height: 1.6; color: #888; }
    @media (max-width: 900px) { .bm25-grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>

<script src="/admin/static/js/admin-api.js?v=m3-publish-20261009"></script>
<script>
(function () {
  if (!checkAdminLogin()) return;

  var ALLOWED_ROLES = ['super_admin', 'tech_ops', 'observer'];
  if (ALLOWED_ROLES.indexOf(getAdminRole()) < 0) {
    window.location.href = '/admin/pages/error.html?type=403';
    return;
  }

  /* 与后端 _VALID_SERVICES 路径一致 */
  var SERVICE_KEY_MAP = {
    'LLM（豆包）': 'doubao',
    'Embedding（阿里云）': 'embedding',
    'Rerank（阿里云）': 'rerank',
    'DashVector（向量检索）': 'dashvector',
    '内容安全': 'content_safety'
  };

  var currentSvcKey = '';
  var configTestPassed = {};
  var refreshTimer = null;
  var observerView = getAdminRole() === 'observer';

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getSvcKey(name) {
    return SERVICE_KEY_MAP[name] || '';
  }

  function statusDotClass(st) {
    if (st === 'normal' || st === 'warning' || st === 'error' || st === 'unknown') return st;
    return 'unknown';
  }

  var serviceSnapshots = {}, modalSnapshot = null, modalPublication = null, modalEpoch = 0, modalTestSequence = 0, modalTestFingerprint = '', statusSequence = 0;
  function serviceFields(svc) { return svc === 'dashvector' ? ['endpoint','collection_name'] : ['endpoint','model']; }
  function renderStandardCard(s, svcKey) {
    var rate=typeof s.success_rate==='number'&&Number.isFinite(s.success_rate)?s.success_rate:null;
    var h='<div class="tp-card" data-svc-card="'+escapeHtml(svcKey)+'"><div class="tp-card-head"><span class="tp-card-title">'+escapeHtml(s.name)+'</span><span class="tp-status-dot '+statusDotClass(s.status)+'"></span></div>';
    [['服务商',s.provider],['模型',s.model],['Endpoint',s.endpoint],['Collection',s.collection_name],['当前版本',s.version],['来源',s.source]].forEach(function(item){if(item[1]!=null)h+='<div class="tp-row"><span>'+item[0]+'</span><span style="overflow-wrap:anywhere;text-align:right">'+escapeHtml(item[1])+'</span></div>';});
    h+='<div class="tp-row"><span>今日调用次数</span><span>'+escapeHtml(s.today_calls==null?'暂无数据':s.today_calls+' 次')+'</span></div>';
    h+='<div class="tp-row"><span>成功率</span><span>'+(rate==null?'暂无数据':escapeHtml(rate)+'%')+'</span></div>';
    h+='<div class="tp-row"><span>平均响应</span><span>'+escapeHtml(s.avg_response_ms==null?'暂无数据':s.avg_response_ms+' ms')+'</span></div>';
    if(s.credential_configured!==undefined)h+='<div class="tp-row"><span>凭据状态</span><span>'+(s.credential_configured ? '已配置' : '未配置')+'</span></div>';
    if(s.runtime_ready!==undefined)h+='<div class="tp-row"><span>配置就绪</span><span>'+(s.runtime_ready===true?'可用':'尚未就绪')+'</span></div>';
    if(!observerView)h+='<div class="tp-card-foot"><button type="button" class="btn btn-default btn-sm tp-config-btn" data-write-action data-display-name="'+escapeHtml(s.name)+'" data-svc-key="'+escapeHtml(svcKey)+'">配置</button></div>';
    return h+'</div>';
  }

  function renderContentSafetyCard(s, svcKey) {
    /* TD-003: 内容安全服务无真实第三方后端，仅检查 Redis 连通性 */
    var dn = escapeHtml(s.name);
    var h = '';
    h += '<div class="tp-card" data-svc-card="' + escapeHtml(svcKey) + '">';
    h += '<div class="tp-card-head"><span class="tp-card-title">' + dn + '</span>';
    h += '<span class="tp-status-dot ' + statusDotClass(s.status) + '"></span></div>';
    h += '<div class="tp-row"><span>今日拦截次数</span><span>' + (s.today_blocked != null ? s.today_blocked : '—') + ' 次</span></div>';
    h += '<div class="tp-row"><span>成功率</span><span style="color:#bbb">—</span></div>';
    h += '<div class="tp-row"><span>平均响应</span><span style="color:#bbb">—</span></div>';
    if (!observerView) {
      h += '<div class="tp-card-foot"><button type="button" class="btn btn-default btn-sm tp-config-btn" data-write-action data-display-name="' + escapeHtml(s.name) + '" data-svc-key="' + escapeHtml(svcKey) + '">配置</button></div>';
    }
    h += '</div>';
    return h;
  }

  function renderServiceCards(services) {
    var grid = document.getElementById('service-grid');
    if (!grid) return;
    var h = '';
    for (var i = 0; i < services.length; i++) {
      var s = services[i];
      var svcKey = s.service_key || getSvcKey(s.name);
      if (!svcKey) continue;
      if (svcKey === 'content_safety') {
        h += renderContentSafetyCard(s, svcKey);
      } else {
        h += renderStandardCard(s, svcKey);
      }
    }
    grid.innerHTML = h;
  }

  function renderBm25(data) {
    var el=document.getElementById('bm25-capability');
    data=data||{};
    var init=data.initialization||{}, index=data.index||{}, backfill=data.backfill||{};
    var initLabels={ready:'已初始化并开放',not_configured:'未配置运行环境',not_initialized:'尚未初始化',initializing:'初始化中',maintenance:'维护中，尚未开放',failed:'初始化失败',target_mismatch:'目标库与运行记录不一致',unverified:'初始化回执待核实',unknown:'状态未知'};
    var indexLabels={ready:'全部就绪',empty:'暂无待建数据',pending:'存在未就绪索引',attention:'存在待处理项',unknown:'状态未知'};
    var backfillLabels={not_started:'无回填记录',pending:'等待执行',running:'进行中',interrupted:'已中断',manual_required:'需要人工处理',completed:'已完成并核对',unverified:'完成情况待核实',unknown:'状态未知'};
    var stageLabels={scan:'扫描',index:'建索引',reconcile:'核对',catchup:'增量追平'};
    var encoderErrors={bm25_profile_mismatch:'编码配置不匹配',bm25_statistics_mismatch:'统计文件不匹配',bm25_package_mismatch:'组件版本不匹配',bm25_analyzer_mismatch:'分词文件不匹配',bm25_profile_unavailable:'编码器加载失败'};
    function count(n){return typeof n==='number'&&Number.isSafeInteger(n)&&n>=0?String(n):'未知';}
    function row(label,value,key){return '<div class="tp-row"><span>'+label+'</span><span data-bm25-field="'+key+'">'+escapeHtml(value)+'</span></div>';}
    var verifiedReady=data.encoder_ready===true&&init.state==='ready'&&['ready','empty'].indexOf(index.state)>=0&&['completed','not_started'].indexOf(backfill.state)>=0;
    var dot=data.encoder_ready===false?'error':data.ready===true&&verifiedReady?'normal':data.ready===false&&init.state&&init.state!=='unknown'?'warning':'unknown';
    var encoder=data.encoder_ready===true?'已就绪':data.encoder_ready===false?(encoderErrors[data.reason]||'未就绪'):'状态未知';
    var indexText=indexLabels[index.state]||'状态未知';
    if(index.total!=null)indexText+=' · 已就绪 '+count(index.ready)+' / 共 '+count(index.total)+' 条';
    var counts=index.total==null?'状态未知':'待处理 '+count(index.pending)+' · 需人工处理 '+count(index.manual)+' · 来源待核实 '+count(index.unverified)+' 条';
    var backfillText=backfillLabels[backfill.state]||'状态未知';
    if(backfill.state!=='completed'&&stageLabels[backfill.stage])backfillText+=' · '+stageLabels[backfill.stage];
    var progress=backfill.state==='not_started'?'无回填记录':backfill.run_id?
      '扫描 '+count(backfill.scanned_records)+' 条 · 已识别 '+count(backfill.unique_source_ids)+' 个源 · '+(backfill.total_known===true?'总源数 '+count(backfill.total_source_ids):'总量待确认')+' · 待核对 '+count(backfill.unresolved_count)+' 项':'状态未知';
    el.innerHTML='<div class="tp-card-head"><span class="tp-card-title">BM25（本地检索）</span><span class="tp-status-dot '+dot+'" aria-label="'+(dot==='normal'?'当前记录均就绪':dot==='unknown'?'状态未知':'存在未就绪或待处理项')+'"></span></div>'+
      '<div class="bm25-grid">'+row('本地组件',data.package?(data.package+' '+(data.version||'版本未知')):'状态未知','package')+row('索引初始化',initLabels[init.state]||'状态未知','initialization')+
      row('本地编码器',encoder,'encoder')+row('当前索引',indexText,'index')+row('回填状态',backfillText,'backfill')+row('索引待处理',counts,'counts')+row('回填进度',progress,'progress')+row('检查时间',data.checked_at?new Date(data.checked_at).toLocaleString('zh-CN',{hour12:false}):'未知','checked_at')+'</div>'+
      '<div class="bm25-version">编码版本：'+escapeHtml(data.encoder_version||'未知')+'</div><p class="bm25-note">本地编码无需配置 Endpoint 或 API Key。状态按当前运行环境的初始化、索引和回填记录展示。</p>'+
      '<div class="tp-card-foot"><a class="btn btn-default btn-sm" href="/admin/pages/memory-index-maintenance.html">查看索引维护</a></div>';
  }
  async function refreshThirdPartyStatus() {
    var sequence=++statusSequence;
    var res=await adminRequest('GET', '/api/admin/third-party/status',null,false,{silentErrorToast:true,timeoutMs:10000});
    if(sequence!==statusSequence)return false;
    if(!res||res.code!==0||!res.data||!Array.isArray(res.data.services)){
      renderBm25(null);
      document.getElementById('service-load-status').textContent='状态加载失败，已有信息可能过期；重新加载成功前不能打开新的配置表单。';
      document.querySelectorAll('.tp-config-btn').forEach(function(b){b.disabled=true;});return false;
    }
    serviceSnapshots={};res.data.services.forEach(function(s){var key=s.service_key||getSvcKey(s.name);if(key)serviceSnapshots[key]=s;});
    renderServiceCards(res.data.services);renderBm25(res.data.bm25);document.getElementById('service-load-status').textContent='';
    return res.data;
  }
  function onModalFieldChange() {
    if(currentSvcKey==='content_safety')return;
    modalTestSequence++;modalTestFingerprint='';configTestPassed[currentSvcKey]=false;
    var btn=document.getElementById('modal-save-btn');if(btn)btn.disabled=true;
    var box=document.getElementById('modal-test-result');if(box)box.textContent='配置已修改，请重新测试。';
    if(modalPublication)modalPublication.changed();
  }
  function fillServiceForm(s) {
    modalSnapshot={};serviceFields(currentSvcKey).forEach(function(k){modalSnapshot[k]=s[k]==null?'':String(s[k]);document.getElementById('modal-'+(k==='collection_name'?'collection':k)).value=modalSnapshot[k];});
    document.getElementById('modal-provider').value=s.provider||'';document.getElementById('modal-apikey').value='';
    document.getElementById('modal-version').textContent='当前版本：'+(s.version==null?'未发布':s.version)+' · 来源：'+(s.source||'未知')+' · 凭据'+(s.credential_configured?'已配置':'未配置');
    onModalFieldChange();
  }
  function modalDraft(svc) {
    var body={};serviceFields(svc).forEach(function(k){body[k]=document.getElementById('modal-'+(k==='collection_name'?'collection':k)).value.trim();if(!body[k])throw new Error('配置字段不能为空');});
    if(!/^https?:\/\//i.test(body.endpoint))throw new Error('请填写有效的 HTTP(S) Endpoint');
    if(svc==='dashvector'&&body.collection_name!=='new_lxm_memory_long_collection')throw new Error('Collection 必须为 new_lxm_memory_long_collection');
    if(svc==='embedding'&&body.model!=='text-embedding-v4')throw new Error('Embedding 模型必须为 text-embedding-v4（1024维）');
    var key=document.getElementById('modal-apikey').value.trim();if(key){if(/\*{3,}|\[REDACTED\]|^已配置$/i.test(key))throw new Error('不可提交脱敏凭据占位值');body.api_key=key;}
    return body;
  }
  function openConfigModal(displayName, svcKey) {
    if(observerView||!SERVICE_KEY_MAP[displayName]&&!serviceSnapshots[svcKey])return;
    if(modalPublication)modalPublication.close();modalPublication=null;
    currentSvcKey=svcKey;var epoch=++modalEpoch;modalTestSequence++;configTestPassed[svcKey]=false;
    var modal=document.getElementById('config-modal'),body=document.getElementById('config-modal-body'),foot=document.getElementById('config-modal-footer');
    document.getElementById('config-modal-title').textContent=displayName+' 配置';
    if(svcKey==='content_safety'){
      body.innerHTML='<div class="alert alert-info">该服务基于项目内置 Redis，通过 Redis 关键词列表检测，无需单独配置 Endpoint 或 API Key。</div><div id="content-safety-test-result" role="status"></div>';
      foot.innerHTML='<button type="button" class="btn btn-default" id="modal-test-redis-btn" data-write-action>测试 Redis 连通性</button><button type="button" class="btn btn-default" id="modal-cancel-btn">关闭</button>';
      document.getElementById('modal-test-redis-btn').onclick=function(){testServiceConnection(svcKey);};
    }else{
      body.innerHTML='<p id="modal-version" class="text-secondary"></p><div class="form-item"><label>服务商（只读）</label><input id="modal-provider" class="form-control" readonly></div>'+
        '<div class="form-item"><label>Endpoint</label><input type="url" id="modal-endpoint" data-write-action class="form-control" autocomplete="off"></div>'+
        (svcKey==='dashvector'?'<div class="form-item"><label>Collection（固定新目标）</label><input id="modal-collection" data-write-action class="form-control"><p class="text-secondary">同一集群目标 new_lxm_memory_long_collection，Endpoint 须与当前集群一致；不支持跨集群切换。保存或测连不代表回填已完成。</p></div>':'<div class="form-item"><label>模型'+(svcKey==='embedding'?'（text-embedding-v4，1024维）':'')+'</label><input id="modal-model" data-write-action class="form-control"></div>')+
        '<div class="form-item"><label>API Key</label><input type="password" id="modal-apikey" data-write-action class="form-control" placeholder="留空则保留原值" autocomplete="off"></div>'+
        '<div id="modal-test-result" role="status"></div><p id="modal-publication-status" role="status" aria-live="polite"></p>';
      foot.innerHTML='<button type="button" class="btn btn-default" id="modal-test-btn" data-write-action>测试连接</button><button type="button" class="btn btn-primary" id="modal-save-btn" data-write-action disabled>保存</button><button type="button" class="btn btn-default" id="modal-publication-refresh">刷新当前配置</button><button type="button" class="btn btn-default" id="modal-publication-verify" hidden>核实本次发布</button><button type="button" class="btn btn-default" id="modal-cancel-btn">关闭</button>';
      modalPublication=publicationForm({legacy:svcKey==='doubao',key:'third-party:'+svcKey,path:'/api/admin/third-party/'+svcKey+'/config',status:'modal-publication-status',save:'modal-save-btn',verify:'modal-publication-verify',refresh:'modal-publication-refresh',canSave:function(){return configTestPassed[svcKey];},lock:function(locked){document.querySelectorAll('#config-modal-body input[data-write-action]').forEach(function(input){input.disabled=locked;});document.getElementById('modal-test-btn').disabled=locked;},read:async function(){
        var data=await refreshThirdPartyStatus();if(epoch!==modalEpoch||!data)return false;
        var s=serviceSnapshots[svcKey];if(!s||serviceFields(svcKey).some(function(k){return typeof s[k]!=='string';}))return false;
        fillServiceForm(s);modalPublication.observeClock(data);return true;
      }});
      document.querySelectorAll('#config-modal-body input[data-write-action]').forEach(function(input){input.oninput=onModalFieldChange;});
      document.getElementById('modal-test-btn').onclick=function(){testServiceConnection(svcKey);};
      document.getElementById('modal-save-btn').onclick=function(){saveServiceConfig(svcKey);};
      modalPublication.start();
    }
    document.getElementById('modal-cancel-btn').onclick=closeConfigModal;modal.classList.add('show');
  }
  function closeConfigModal() {
    if(modalPublication)modalPublication.close();modalPublication=null;modalEpoch++;modalTestSequence++;
    document.getElementById('config-modal').classList.remove('show');currentSvcKey='';
    var key=document.getElementById('modal-apikey');if(key)key.value='';
  }
  async function testServiceConnection(svcKey) {
    if(observerView||currentSvcKey!==svcKey||(svcKey!=='content_safety'&&!modalPublication.editable()))return;
    var payload={};try{if(svcKey!=='content_safety')payload=modalDraft(svcKey);}catch(e){showToast(e.message,'warning');return;}
    var seq=++modalTestSequence,epoch=modalEpoch,fingerprint=JSON.stringify(payload);
    configTestPassed[svcKey]=false;var save=document.getElementById('modal-save-btn');if(save)save.disabled=true;
    var box=document.getElementById(svcKey==='content_safety'?'content-safety-test-result':'modal-test-result');box.textContent='正在测试当前配置…';
    var res=await adminRequest('POST','/api/admin/third-party/'+svcKey+'/test-connection',payload,false,{silentErrorToast:true,timeoutMs:30000});
    if(epoch!==modalEpoch||seq!==modalTestSequence||svcKey!==currentSvcKey)return;
    if(svcKey!=='content_safety'){try{if(JSON.stringify(modalDraft(svcKey))!==fingerprint||!modalPublication.editable())return;}catch(_){return;}}
    if(res&&res.code===0&&res.data&&res.data.connected===true){
      configTestPassed[svcKey]=true;modalTestFingerprint=fingerprint;if(save)save.disabled=false;box.textContent='连接测试通过。保存时服务端仍校验最终配置。';
    }else{configTestPassed[svcKey]=false;if(save)save.disabled=true;box.textContent='连接测试失败，请核对配置、权限与凭据。';}
  }
  async function saveServiceConfig(svcKey) {
    if(!modalPublication||!modalPublication.editable()||!configTestPassed[svcKey]||svcKey!==currentSvcKey)return;
    var body;try{body=modalDraft(svcKey);}catch(e){showToast(e.message,'warning');return;}
    if(JSON.stringify(body)!==modalTestFingerprint){onModalFieldChange();return;}
    var patch={};Object.keys(body).forEach(function(k){if(body[k]!==modalSnapshot[k])patch[k]=body[k];});await modalPublication.submit(patch);
  }

  document.body.innerHTML =
    renderSidebar('third-party') +
    renderHeader('第三方服务监控') +
    '<div class="admin-content">' +
      '<p id="service-load-status" role="status"></p><div id="bm25-capability" class="tp-card" role="status" aria-live="polite">正在加载本地 BM25 能力…</div>' +
      '<div id="service-grid">' +
        '<div class="skeleton"></div>' +
        '<div class="skeleton"></div>' +
        '<div class="skeleton"></div>' +
        '<div class="skeleton"></div>' +
      '</div>' +
    '</div>' +
    '<div id="config-modal" class="modal-overlay">' +
      '<div class="modal-content" style="min-width:400px;max-width:520px">' +
        '<div class="modal-header">' +
          '<h3 id="config-modal-title">配置</h3>' +
          '<button type="button" class="btn btn-link" id="config-modal-x">✕</button>' +
        '</div>' +
        '<div class="modal-body" id="config-modal-body"></div>' +
        '<div class="modal-footer" id="config-modal-footer"></div>' +
      '</div>' +
    '</div>';

  document.getElementById('service-grid').addEventListener('click', function (e) {
    var btn = e.target.closest('.tp-config-btn');
    if (!btn) return;
    var dn = btn.getAttribute('data-display-name') || '';
    var sk = btn.getAttribute('data-svc-key') || '';
    openConfigModal(dn, sk);
  });

  document.getElementById('config-modal').addEventListener('click', function (e) {
    if (e.target.id === 'config-modal') closeConfigModal();
  });
  document.getElementById('config-modal-x').onclick = closeConfigModal;

  refreshThirdPartyStatus();
  refreshTimer = setInterval(refreshThirdPartyStatus, 60000);

  window.addEventListener('beforeunload', function () {
    if (refreshTimer) clearInterval(refreshTimer);
  });
  // 页面仅保存发布定位；正文、凭据不进入 sessionStorage。
  function publicationForm(options) {
    var state = 'loading', receipt = null, timer = null, clockOffset = 0, closed = false;
    var storageKey = 'config-publication:' + options.key;
    var observer = getAdminRole() === 'observer';
    function byId(id) { return document.getElementById(id); }
    function remember() {
      try { if (receipt) sessionStorage.setItem(storageKey, JSON.stringify(receipt)); else sessionStorage.removeItem(storageKey); } catch (_) {}
    }
    function stop() { if (timer) clearTimeout(timer); timer = null; }
    function set(next, message) {
      state = next;
      var busy = ['loading','load_failed','submitting','submission_unverified','saved_refresh_pending'].indexOf(state) >= 0;
      byId(options.status).textContent = message;
      byId(options.save).disabled = observer || busy || (options.canSave && !options.canSave());
      byId(options.verify).hidden = !!options.legacy || !receipt || receipt.commit_state === 'committed';
      byId(options.verify).disabled = state === 'submitting';
      byId(options.refresh).hidden = !!receipt && receipt.commit_state !== 'committed';
      byId(options.refresh).disabled = state === 'loading' || state === 'submitting';
      if (options.lock) options.lock(busy || observer);
    }
    function uuid7() {
      var bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
      var ms = Date.now() + clockOffset;
      for (var i = 5; i >= 0; i--) { bytes[i] = ms % 256; ms = Math.floor(ms / 256); }
      bytes[6] = (bytes[6] & 15) | 112; bytes[8] = (bytes[8] & 63) | 128;
      var hex = Array.from(bytes, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
    }
    function observeClock(data) {
      var ms = data && Date.parse(data.server_time);
      if (Number.isFinite(ms)) clockOffset = ms - Date.now();
    }
    async function refresh() {
      if (receipt && receipt.commit_state !== 'committed') return;
      set('loading', receipt ? '已保存，正在刷新当前配置…' : '正在加载…');
      var ok = false;
      try { ok = await options.read(); } catch (_) {}
      if (closed) return;
      if (!ok) {
        set(receipt ? 'saved_refresh_pending' : 'load_failed', receipt ? '已保存（本次版本 '+receipt.committed_version+'），当前配置回读失败，待刷新；不会重新提交。' : '加载失败，暂不能保存。请刷新重试。');
        return;
      }
      var message = receipt ? '已保存（本次版本 '+receipt.committed_version+'）；下方展示当前'+(options.legacy?'运行':'')+'配置及其来源。' : '已加载；只提交修改的字段。';
      receipt = null; remember(); set('clean', message);
    }
    async function accept(result) {
      if (closed) return;
      var data = result && result.data;
      if (data && data.publish_id === receipt.publish_id) {
        observeClock(data);
        if (data.commit_state === 'committed' && data.committed_version != null) {
          stop(); receipt.commit_state = 'committed'; receipt.committed_version = data.committed_version;
          remember(); await refresh(); return;
        }
        if (data.commit_state === 'rejected') {
          stop(); receipt = null; remember(); set('error', '本次发布已拒绝，请检查输入后重新提交。'); return;
        }
        if (data.commit_state === 'expired') {
          stop(); receipt.commit_state = 'expired'; remember(); set('submission_unverified', '本次回执已过保障期，需人工核实；不能重新提交本次操作。'); return;
        }
      }
      set('submission_unverified', '本次发布结果待核实，输入已保留；仅查询发布 '+receipt.publish_id+'，不会重复提交。');
    }
    async function verify() {
      if (options.legacy || !receipt || receipt.commit_state === 'committed' || closed || !getAdminToken()) return;
      var id = receipt.publish_id;
      var result = await adminRequest('GET', '/api/admin/configs/publications/' + encodeURIComponent(id), null, false, {silentErrorToast:true,returnErrorResponse:true,timeoutMs:5000});
      if (receipt && receipt.publish_id === id) await accept(result);
    }
    function schedule(delay) {
      stop();
      if (options.legacy || !receipt || closed || receipt.commit_state === 'expired' || document.hidden || !getAdminToken()) return;
      if (Date.now() >= receipt.observe_until) { set('submission_unverified', '自动核实已停止，结果仍待核实；可手动查询原发布身份，不可重复提交。'); return; }
      timer = setTimeout(async function () {
        if (!receipt || Date.now() >= receipt.observe_until) { if (receipt) set('submission_unverified', '自动核实已停止，结果仍待核实；可手动查询原发布身份，不可重复提交。'); return; }
        await verify(); if (receipt && state === 'submission_unverified') schedule(Math.min(5000, Math.round(delay * 1.5)));
      }, Math.min(delay, receipt.observe_until - Date.now()));
    }
    function legacyUnknown() {
      set('submission_unverified', '本次保存结果待核实。该旧配置入口没有精确发布回执；输入已保留，请人工核实，不会自动重试或查询不存在的发布记录。');
    }
    async function submitLegacy(body) {
      // 旧豆包保存响应只有 version；不发送或伪造持久发布身份。
      receipt = {legacy:true,commit_state:'unknown'}; remember();
      set('submitting', '正在保存，请勿重复操作…');
      var result = await adminRequest('PUT', options.path, body, false, {silentErrorToast:true,returnErrorResponse:true,timeoutMs:30000});
      if (result && result.code === 0 && result.data && result.data.version != null) {
        receipt.commit_state = 'committed'; receipt.committed_version = result.data.version;
        remember(); if (!closed) await refresh(); return;
      }
      if (result && ([400,401,403,422,5001,20120].indexOf(result.code) >= 0 || result.detail)) {
        receipt = null; remember(); if (!closed) set('error', '本次保存被拒绝，请检查字段、连接测试和权限后重试。'); return;
      }
      if (!closed) legacyUnknown();
    }
    async function submit(body) {
      if (observer || ['clean','dirty','error'].indexOf(state) < 0) return;
      if (!Object.keys(body).length) { showToast('没有检测到变更', 'info'); return; }
      if (options.legacy) { await submitLegacy(body); return; }
      var id;
      try { id = uuid7(); } catch (_) { set('error', '浏览器无法生成安全发布身份，未发送请求。'); return; }
      receipt = {publish_id:id,commit_state:'unknown',observe_until:Date.now()+60000}; remember();
      set('submitting', '正在提交，请勿重复操作…');
      var result = await adminRequest('PUT', options.path, body, false, {idempotencyKey:id,silentErrorToast:true,returnErrorResponse:true,timeoutMs:30000});
      // 确定的校验/准入拒绝可纠正；网络/持久化未知只能读原回执。
      if (result && (([400,401,403,422,20120,20121,20127].indexOf(result.code) >= 0) || result.detail)) {
        receipt = null; remember(); set('error', '本次发布被拒绝，请检查字段和权限后重试。'); return;
      }
      await accept(result);
      if (state === 'submission_unverified') schedule(2000);
    }
    function changed() {
      if (['clean','dirty','error'].indexOf(state) >= 0) set('dirty', '有未保存的修改。');
    }
    async function start() {
      try { receipt = JSON.parse(sessionStorage.getItem(storageKey) || 'null'); } catch (_) { receipt = null; }
      if (receipt && (receipt.publish_id || receipt.legacy) && receipt.commit_state !== 'committed') {
        try { await options.read(); } catch (_) {}
        if (options.legacy) { receipt = {legacy:true,commit_state:'unknown'}; remember(); legacyUnknown(); return; }
        set('submission_unverified', '上次发布结果待核实；页面未保存原正文和密钥，仅可查询原发布身份。'); schedule(2000);
      } else { await refresh(); }
    }
    byId(options.verify).onclick = verify; byId(options.refresh).onclick = refresh;
    window.addEventListener('beforeunload', function () { closed = true; stop(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (state === 'submission_unverified') schedule(2000); });
    return {start:start,submit:submit,changed:changed,observeClock:observeClock,close:function(){closed=true;stop();},sync:function(){set(state,byId(options.status).textContent);},editable:function(){return ['clean','dirty','error'].indexOf(state)>=0;}};
  }

})();
</script>
