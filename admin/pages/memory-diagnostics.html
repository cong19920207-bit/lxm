<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆检索诊断 - 林小梦管理后台</title><link rel="stylesheet" href="/admin/static/css/admin-common.css"><style>[hidden]{display:none!important}.ma-controls,.ma-filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.ma-filter input,.ma-filter select,.ma-controls select{padding:7px;border:1px solid var(--border);border-radius:4px}.ma-list>article{padding:12px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.ma-field{display:flex;gap:4px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.ma-field strong{min-width:125px}.ma-field span{min-width:0}.ma-status{color:var(--text-secondary);white-space:pre-wrap}.ma-list pre,pre.ma-text{white-space:pre-wrap;overflow-wrap:anywhere;background:#fafafa;padding:10px;max-height:340px;overflow:auto}.ma-list .btn{margin:6px}.ma-card-title{margin-bottom:10px}textarea{width:100%;min-height:100px;padding:8px}</style></head><body><div id="sidebar-mount"></div><main class="admin-content"><div id="header-mount"></div><section class="page-card"><h2>记忆检索诊断</h2><p>诊断使用当前有效配置与上下文，仅执行检索和实际选入；外部调用可能产生费用。输入不进入聊天队列。</p><form id="diag-input"><div class="ma-filter" data-write-action><label>用户ID <input name="user_id" inputmode="numeric" required pattern="[1-9][0-9]*"></label><label>链路来源 <select name="source"><option value="main">主文字</option><option value="openapi">OpenAPI</option><option value="step8">Step8 / future_action</option></select></label></div><label data-write-action>输入文本<textarea name="input" required maxlength="2000"></textarea></label><p id="input-range">主文字/OpenAPI：1～2000字符；Step8：1～200字符，不消费Future槽。</p><button class="btn btn-primary" type="submit" data-write-action>执行诊断</button></form><p id="submission-state" class="ma-status" aria-live="polite"></p><button id="query-active" class="btn btn-default">核实本次执行</button></section><section class="page-card"><h3>诊断历史</h3><form id="diag-filter" class="ma-filter"><label>用户ID <input name="user_id" inputmode="numeric"></label><label>来源 <select name="source"><option value="">全部</option><option value="main">main</option><option value="openapi">openapi</option><option value="step8">step8</option></select></label><label>执行状态 <select name="state"><option value="">全部</option><option value="accepted">accepted</option><option value="running">running</option><option value="completed">completed</option><option value="degraded">degraded</option><option value="failed">failed</option><option value="budget_blocked">budget_blocked</option><option value="interrupted">interrupted</option><option value="manual_required">manual_required</option></select></label><label>开始日期 <input type="date" name="start_date"></label><label>结束日期 <input type="date" name="end_date"></label><button class="btn btn-default">查询</button></form><div id="diag-history"></div></section><section id="diag-detail" class="page-card" hidden><h3>历史诊断详情</h3><p>历史快照仅供查看，非当前有效记忆；不是恢复或补索引来源。</p><div id="diag-actions" class="ma-controls"></div><h4>① 用户与输入</h4><div id="diag-context"></div><h4>② 本次冻结版本与装载来源</h4><div id="diag-version"></div><h4>③ 四路输入与候选</h4><div id="diag-queries"></div><label>候选路 <select id="candidate-route"><option value="">全部</option><option>cg</option><option>cp</option><option>ck</option><option>user</option></select></label><div id="diag-candidates"></div><h4>④ 同次实际选入与Token</h4><div id="diag-selection"></div><h4>⑤ 阶段、调用与执行/保存状态</h4><div id="diag-status"></div></section></main><script src="/admin/static/js/admin-api.js?v=step018"></script><script src="/admin/static/js/memory-admin-common.js?v=step018"></script><script src="/admin/static/js/memory-diagnostics-admin.js?v=step018"></script></body></html>
