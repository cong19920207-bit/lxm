<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>索引维护 - 林小梦管理后台</title><link rel="stylesheet" href="/admin/static/css/admin-common.css"><style>[hidden]{display:none!important}.ma-controls,.ma-filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.ma-filter input,.ma-filter select,.ma-controls select{padding:7px;border:1px solid var(--border);border-radius:4px}.ma-list>article{padding:12px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.ma-field{display:flex;gap:4px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.ma-field strong{min-width:125px}.ma-field span{min-width:0}.ma-status{color:var(--text-secondary);white-space:pre-wrap}.ma-list pre,pre.ma-text{white-space:pre-wrap;overflow-wrap:anywhere;background:#fafafa;padding:10px;max-height:340px;overflow:auto}.ma-list .btn{margin:6px}.ma-card-title{margin-bottom:10px}textarea{width:100%;min-height:100px;padding:8px}</style></head><body><div id="sidebar-mount"></div><main class="admin-content"><div id="header-mount"></div><section class="page-card"><h2>索引维护</h2><p>源结果、索引结果与维护状态分别核实；历史删除仅清展示记录，不取消任务。</p><div class="tabs"><button id="tasks-tab" class="btn btn-default">索引任务</button><button id="backfills-tab" class="btn btn-default">回填批次</button></div></section><section id="tasks-pane" class="page-card"><form id="tasks-filter" class="ma-filter"><label>用户ID <input name="user_id"></label><label>记忆身份 doc_id <input name="doc_id" maxlength="64"></label><label>类型 <select name="type"><option value="">全部</option><option value="character_global">character_global</option><option value="character_private">character_private</option><option value="character_knowledge">character_knowledge</option><option value="user">user</option></select></label><label>状态 <select name="state"><option value="">全部</option><option value="pending">pending</option><option value="running">running</option><option value="retry_wait">retry_wait</option><option value="manual_required">manual_required</option><option value="completed">completed</option><option value="superseded">superseded</option><option value="source_unverified">source_unverified</option></select></label><label>操作 <select name="operation"><option value="">全部</option><option value="create">create</option><option value="update">update</option><option value="delete">delete</option><option value="index">index</option><option value="retry">retry</option><option value="baseline">baseline</option><option value="batch">batch</option></select></label><label>来源 <select name="source"><option value="">全部</option><option value="admin">admin</option><option value="text">text</option><option value="voice">voice</option><option value="system">system</option></select></label><label>开始日期 <input type="date" name="start_date"></label><label>结束日期 <input type="date" name="end_date"></label><button class="btn btn-default">查询</button></form><div id="tasks-list"></div></section><section id="backfills-pane" class="page-card" hidden><p>仅读取既有批次，不启动、暂停或重跑回填。</p><form id="backfills-filter" class="ma-filter"><label>状态 <select name="state"><option value="">全部</option><option value="pending">pending</option><option value="running">running</option><option value="interrupted">interrupted</option><option value="manual_required">manual_required</option><option value="completed">completed</option></select></label><label>阶段 <select name="stage"><option value="">全部</option><option value="scan">scan</option><option value="index">index</option><option value="reconcile">reconcile</option><option value="catchup">catchup</option></select></label><label>开始日期 <input type="date" name="start_date"></label><label>结束日期 <input type="date" name="end_date"></label><button class="btn btn-default">查询</button></form><div id="backfills-list"></div></section><section id="maintenance-detail" class="page-card" hidden><h3 id="maintenance-title"></h3><div id="maintenance-actions" class="ma-controls"></div><p id="maintenance-feedback" class="ma-status" aria-live="polite"></p><div id="maintenance-summary"></div><div id="items-filter" class="ma-filter" hidden><label>来源分类 <select id="item-class"><option value="">全部</option><option>standard_kv</option><option>legacy_free_text</option><option>empty</option><option>identity_or_parse_error</option></select></label><label>对账结果 <select id="item-state"><option value="">全部</option><option>matched</option><option>missing</option><option>extra</option><option>mismatch</option><option>unknown</option><option>retry_wait</option><option>identity_or_parse_error</option></select></label></div><h4 id="items-title"></h4><div id="maintenance-items"></div><h4 id="links-title"></h4><div id="maintenance-links"></div></section></main><script src="/admin/static/js/admin-api.js?v=step018"></script><script src="/admin/static/js/memory-admin-common.js?v=step018"></script><script src="/admin/static/js/memory-index-maintenance-admin.js?v=step018"></script></body></html>
