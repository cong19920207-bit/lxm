<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>索引维护 - 林小梦管理后台</title>
  <link rel="stylesheet" href="/admin/static/css/admin-common.css">
  <link rel="stylesheet" href="/admin/static/css/memory-admin.css?v=desk-1">
</head>
<body class="memory-admin">
<button class="ma-menu-toggle" type="button" aria-controls="sidebar-mount" aria-expanded="false" aria-label="打开导航">☰</button>
<button class="ma-menu-shade" type="button" aria-label="关闭导航" tabindex="-1"></button>
<div id="sidebar-mount"></div>
<main class="admin-content">
<div id="header-mount"></div>
<div class="ma-workspace">
<header class="ma-page-heading"><h1>索引维护</h1><p>查看记忆索引的处理结果，追踪重试任务与回填进度。</p></header>
<div class="ma-tabs" role="tablist" aria-label="页面视图">
<button type="button" role="tab" id="tasks-tab" aria-controls="tasks-pane" aria-selected="true" tabindex="0">索引任务</button>
<button type="button" role="tab" id="backfills-tab" aria-controls="backfills-pane" aria-selected="false" tabindex="-1">回填批次</button>
</div>
<section id="tasks-pane" role="tabpanel" aria-labelledby="tasks-tab" class="ma-card">
<header class="ma-card-head"><h2>索引任务列表</h2><p>按记忆、状态或时间查找任务，查看来源与索引结果。</p></header>
<form id="tasks-filter" class="ma-filter">
<label>用户ID <input name="user_id"></label>
<label>记忆 ID <input name="doc_id" maxlength="64"></label>
<label>类型 <select name="type"><option value="">全部</option>
<option value="character_global">角色公共记忆</option>
<option value="character_private">角色私有记忆</option>
<option value="character_knowledge">角色知识</option>
<option value="user">用户记忆</option></select></label>
<label>状态 <select name="state"><option value="">全部</option>
<option value="pending">等待处理</option>
<option value="running">执行中</option>
<option value="retry_wait">等待重试</option>
<option value="manual_required">需人工处理</option>
<option value="completed">已完成</option>
<option value="superseded">已被替代</option>
<option value="source_unverified">来源待核实</option></select></label>
<label>操作 <select name="operation"><option value="">全部</option>
<option value="create">新增</option>
<option value="update">更新</option>
<option value="delete">删除</option>
<option value="index">建索引</option>
<option value="retry">重试</option>
<option value="baseline">基线</option>
<option value="batch">批处理</option></select></label>
<label>来源 <select name="source"><option value="">全部</option>
<option value="admin">管理后台</option>
<option value="text">文字对话</option>
<option value="voice">语音</option>
<option value="system">系统</option></select></label>
<label>开始日期 <input type="date" name="start_date"></label>
<label>结束日期 <input type="date" name="end_date"></label>
<button type="submit" class="btn btn-primary">查询</button>
</form>
<div id="tasks-list"></div>
</section>
<section id="backfills-pane" role="tabpanel" aria-labelledby="backfills-tab" class="ma-card" hidden>
<header class="ma-card-head"><h2>回填批次列表</h2><p>查看已有批次的扫描进度、对账结果和关联任务。</p></header>
<form id="backfills-filter" class="ma-filter">
<label>状态 <select name="state"><option value="">全部</option>
<option value="pending">等待处理</option>
<option value="running">执行中</option>
<option value="interrupted">已中断</option>
<option value="manual_required">需人工处理</option>
<option value="completed">已完成</option></select></label>
<label>阶段 <select name="stage"><option value="">全部</option>
<option value="scan">扫描</option>
<option value="index">建索引</option>
<option value="reconcile">对账</option>
<option value="catchup">追赶更新</option></select></label>
<label>开始日期 <input type="date" name="start_date"></label>
<label>结束日期 <input type="date" name="end_date"></label>
<button type="submit" class="btn btn-primary">查询</button>
</form>
<div id="backfills-list"></div>
</section>
<section id="maintenance-detail" class="ma-card" hidden>
<header class="ma-card-head"><h2 id="maintenance-title"></h2></header>
<div id="maintenance-actions" class="ma-controls"></div>
<p id="maintenance-feedback" class="ma-status" aria-live="polite"></p>
<div id="maintenance-summary" class="ma-summary-grid"></div>
<section class="ma-block"><h3 id="items-title"></h3>
<div id="items-filter" class="ma-filter" hidden><label>来源分类 <select id="item-class"><option value="">全部</option>
<option value="standard_kv">标准键值</option>
<option value="legacy_free_text">历史自由文本</option>
<option value="empty">空内容</option>
<option value="identity_or_parse_error">身份或解析异常</option></select></label>
<label>对账结果 <select id="item-state"><option value="">全部</option>
<option value="matched">一致</option>
<option value="missing">缺失</option>
<option value="extra">多余</option>
<option value="mismatch">不匹配</option>
<option value="unknown">待核实</option>
<option value="retry_wait">等待重试</option>
<option value="identity_or_parse_error">身份或解析异常</option></select></label></div>
<div id="maintenance-items"></div></section>
<section class="ma-block"><h3 id="links-title"></h3><div id="maintenance-links"></div></section>
</section>
</div>
</main>
<script src="/admin/static/js/admin-api.js?v=desk-1"></script>
<script src="/admin/static/js/memory-admin-common.js?v=desk-1"></script>
<script src="/admin/static/js/memory-index-maintenance-admin.js?v=desk-1"></script>
</body>
</html>
