<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>林小梦 · 通话摘要已生成</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #08070c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button, textarea { font: inherit; }
    .chat {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: min(100vw, 402px);
      height: min(100dvh, 874px);
      min-height: 640px;
      overflow: hidden;
      background: #17111f;
    }
    .background,
    .background::after { position: absolute; inset: 0; }
    .background {
      z-index: -2;
      background: url('../../../../../../frontend/static/images/avatar/default.png') center 38% / cover no-repeat;
      filter: saturate(.84) brightness(.76);
    }
    .background::after {
      content: "";
      background: linear-gradient(180deg, rgba(20, 12, 35, .34) 0%, rgba(20, 12, 35, .17) 39%, rgba(16, 9, 28, .5) 100%);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: max(12px, env(safe-area-inset-top)) 12px 9px;
    }
    .back, .profile, .more {
      border: 1px solid rgba(239, 232, 255, .42);
      background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(92, 65, 146, .16));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .36), 0 5px 16px rgba(0, 0, 0, .16);
      backdrop-filter: blur(24px) saturate(1.24);
      -webkit-backdrop-filter: blur(24px) saturate(1.24);
    }
    .back, .more {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .back { font-size: 23px; line-height: 1; }
    .more svg { width: 19px; height: 19px; fill: currentColor; }
    .profile {
      flex: 1;
      min-width: 0;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 3px 13px 3px 3px;
      border-radius: 999px;
    }
    .profile img {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, .53);
      border-radius: 50%;
      object-fit: cover;
      object-position: center 24%;
    }
    .profile-copy { min-width: 0; }
    .profile-name { display: block; font-size: 15px; font-weight: 620; line-height: 18px; }
    .profile-state { display: block; margin-top: 1px; color: rgba(192, 255, 165, .92); font-size: 11px; line-height: 13px; }
    .thread { flex: 1; padding: 10px 16px 98px; overflow: auto; scrollbar-width: none; }
    .thread::-webkit-scrollbar { display: none; }
    .time {
      width: fit-content;
      margin: 9px auto 16px;
      padding: 4px 10px;
      border-radius: 999px;
      color: rgba(255, 255, 255, .68);
      background: rgba(11, 7, 20, .23);
      font-size: 11px;
      line-height: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .message { display: flex; margin-bottom: 13px; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 74%;
      padding: 11px 14px;
      border-radius: 21px;
      font-size: 15px;
      line-height: 1.5;
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
    }
    .user .bubble {
      border: 1px solid rgba(255, 255, 255, .28);
      color: #fff;
      background: linear-gradient(150deg, rgba(175, 144, 245, .54), rgba(101, 72, 177, .48));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .32), 0 7px 18px rgba(26, 11, 60, .2);
    }
    .ai .bubble {
      border: 1px solid rgba(255, 255, 255, .58);
      color: #251d2d;
      background: linear-gradient(150deg, rgba(255, 255, 255, .76), rgba(238, 230, 251, .61));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82), 0 7px 18px rgba(0, 0, 0, .14);
    }
    .call-record {
      position: relative;
      display: block;
      width: 100%;
      margin: 8px 0 16px;
      padding: 14px 15px 13px;
      overflow: hidden;
      border: 1px solid rgba(232, 220, 255, .42);
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, rgba(65, 43, 105, .72), rgba(37, 24, 65, .58));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 11px 29px rgba(15, 8, 32, .24);
      text-align: left;
      backdrop-filter: blur(23px) saturate(1.24);
      -webkit-backdrop-filter: blur(23px) saturate(1.24);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .call-record::before {
      content: "";
      position: absolute;
      top: -58px;
      right: -28px;
      width: 182px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(190, 126, 255, .28), transparent 68%);
      pointer-events: none;
    }
    .record-main, .record-detail { position: relative; }
    .record-main { display: flex; align-items: flex-start; gap: 10px; }
    .record-icon {
      width: 36px;
      height: 36px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      margin-top: 1px;
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(128, 165, 255, .86), rgba(177, 85, 242, .88));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .34), 0 5px 12px rgba(68, 34, 154, .24);
    }
    .record-icon svg { width: 18px; height: 18px; fill: #fff; }
    .record-title { flex: 1; min-width: 0; }
    .record-heading { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .record-heading strong { font-size: 15px; line-height: 20px; font-weight: 630; }
    .ready-mark {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px 2px 5px;
      border: 1px solid rgba(233, 219, 255, .2);
      border-radius: 99px;
      color: rgba(235, 225, 255, .69);
      background: rgba(255, 255, 255, .06);
      font-size: 10px;
      line-height: 13px;
      white-space: nowrap;
    }
    .ready-mark i { width: 5px; height: 5px; border-radius: 50%; background: #bfa5ff; box-shadow: 0 0 6px rgba(197, 165, 255, .84); }
    .record-summary {
      display: -webkit-box;
      margin-top: 3px;
      overflow: hidden;
      color: rgba(241, 234, 255, .76);
      font-size: 12px;
      line-height: 17px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
    }
    .record-meta { display: grid; justify-items: end; gap: 3px; flex: 0 0 auto; }
    .record-duration { color: rgba(255, 255, 255, .78); font-size: 13px; line-height: 17px; font-variant-numeric: tabular-nums; }
    .record-chevron { width: 16px; height: 16px; color: rgba(244, 237, 255, .78); transition: transform .25s ease; }
    .record-chevron svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .record-detail {
      display: grid;
      grid-template-rows: 0fr;
      margin: 0 0 0 46px;
      transition: grid-template-rows .25s ease, margin .25s ease;
    }
    .record-detail-inner { min-height: 0; overflow: hidden; }
    .record-detail-label { display: block; margin-bottom: 4px; color: rgba(218, 201, 255, .56); font-size: 11px; line-height: 15px; letter-spacing: .06em; }
    .record-detail-copy { display: block; color: rgba(247, 242, 255, .86); font-size: 13px; line-height: 20px; }
    .call-record[aria-expanded="true"] {
      border-color: rgba(230, 211, 255, .62);
      background: linear-gradient(135deg, rgba(76, 50, 121, .76), rgba(42, 27, 73, .66));
    }
    .call-record[aria-expanded="true"] .record-summary { -webkit-line-clamp: 2; }
    .call-record[aria-expanded="true"] .record-detail { grid-template-rows: 1fr; margin-top: 11px; }
    .call-record[aria-expanded="true"] .record-chevron { transform: rotate(180deg); }
    .call-record:active { transform: scale(.985); }
    .composer {
      position: absolute;
      right: 8px;
      bottom: 0;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px max(12px, calc(env(safe-area-inset-bottom) + 7px));
      border: 1px solid rgba(219, 204, 255, .19);
      border-bottom: 0;
      border-radius: 25px 25px 0 0;
      background: rgba(28, 18, 48, .66);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 -8px 24px rgba(4, 1, 11, .12);
      backdrop-filter: blur(28px) saturate(1.16);
      -webkit-backdrop-filter: blur(28px) saturate(1.16);
    }
    .composer textarea {
      flex: 1;
      height: 40px;
      padding: 10px 14px;
      resize: none;
      border: 0;
      border-radius: 20px;
      outline: 0;
      color: #29212f;
      background: rgba(255, 255, 255, .96);
      font-size: 14px;
      line-height: 20px;
    }
    .composer textarea::placeholder { color: rgba(35, 28, 42, .42); }
    .send {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(135deg, #7f8ff1, #9d5ee8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 5px 12px rgba(39, 18, 90, .28);
      opacity: .56;
    }
    .send svg { width: 18px; height: 18px; fill: currentColor; }
    .send.is-ready { cursor: pointer; opacity: 1; }
    .send:active { transform: scale(.93); }
    .call-record:focus-visible, .back:focus-visible, .more:focus-visible, .send:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (min-width: 403px) { .chat { border-radius: 0; } }
    @media (max-height: 720px) {
      .thread { padding-top: 2px; }
      .time { margin-top: 3px; margin-bottom: 10px; }
      .message { margin-bottom: 9px; }
      .call-record { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="与林小梦的聊天，通话摘要已生成">
    <div class="background" aria-hidden="true"></div>
    <header class="topbar">
      <button class="back" type="button" aria-label="返回">‹</button>
      <div class="profile">
        <img src="../../../../../../frontend/static/images/avatar/default.png" alt="林小梦" />
        <div class="profile-copy"><span class="profile-name">林小梦</span><span class="profile-state">在线</span></div>
      </div>
      <button class="more" type="button" aria-label="更多操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
    </header>
    <section class="thread" aria-label="聊天记录">
      <p class="time">昨天 21:12</p>
      <div class="message user"><div class="bubble">那我先去吃饭了</div></div>
      <div class="message ai"><div class="bubble">好，吃完跟我说一声。</div></div>
      <p class="time">今天 21:48</p>
      <button class="call-record" type="button" aria-expanded="false">
        <span class="record-main">
          <span class="record-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9Z"/></svg></span>
          <span class="record-title">
            <span class="record-heading"><strong>语音通话</strong><span class="ready-mark"><i></i>已整理</span></span>
            <span class="record-summary">聊了最近连续加班和下个月去日本的计划</span>
          </span>
          <span class="record-meta"><span class="record-duration">05:32</span><span class="record-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></span></span>
        </span>
        <span class="record-detail"><span class="record-detail-inner"><span class="record-detail-label">通话摘要</span><span class="record-detail-copy">聊了最近连续加班和下个月去日本的计划。</span></span></span>
      </button>
    </section>
    <form class="composer" onsubmit="return false">
      <textarea aria-label="输入消息" placeholder="想和我吐槽什么…" rows="1"></textarea>
      <button class="send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.6 21 12 3.4 3.4v6.8L14 12 3.4 13.8Z"/></svg></button>
    </form>
  </main>
  <script>
    const record = document.querySelector('.call-record');
    record.addEventListener('click', () => record.setAttribute('aria-expanded', String(record.getAttribute('aria-expanded') !== 'true')));
    const input = document.querySelector('textarea');
    const send = document.querySelector('.send');
    input.addEventListener('input', () => send.classList.toggle('is-ready', input.value.trim().length > 0));
  </script>
</body>
</html>
