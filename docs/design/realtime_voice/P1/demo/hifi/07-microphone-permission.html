<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>林小梦 · 麦克风授权</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #08070c;
      color: #faf7ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button { font: inherit; }
    .permission {
      position: relative;
      isolation: isolate;
      width: min(100vw, 402px);
      height: min(100dvh, 874px);
      min-height: 640px;
      overflow: hidden;
      background: #0a0711;
    }
    .artwork,
    .artwork::after { position: absolute; inset: 0; }
    .artwork {
      z-index: -2;
      background: url('../../../../../../frontend/static/images/Index/Index.png') center top / cover no-repeat;
      filter: brightness(.84) saturate(.88);
    }
    .artwork::after {
      content: "";
      background: linear-gradient(180deg, rgba(5, 4, 12, .18) 0%, rgba(5, 4, 12, .05) 38%, rgba(5, 4, 12, .14) 53%, rgba(5, 4, 12, .9) 100%);
    }
    .close {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      color: rgba(255, 255, 255, .82);
      background: rgba(18, 12, 31, .28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-width: 1.8; }
    .content {
      position: absolute;
      right: 0;
      bottom: max(30px, calc(env(safe-area-inset-bottom) + 14px));
      left: 0;
      padding: 0 24px;
      text-align: center;
    }
    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border: 1px solid rgba(220, 208, 255, .48);
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(159, 183, 255, .42), rgba(154, 84, 232, .35));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 9px 22px rgba(49, 23, 106, .22);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
    }
    .icon svg { width: 24px; height: 24px; fill: #fff; }
    h1 { margin: 0; font-size: 26px; line-height: 1.26; font-weight: 630; letter-spacing: .01em; }
    p { margin: 10px 8px 0; color: rgba(239, 233, 251, .68); font-size: 14px; line-height: 21px; }
    .allow {
      position: relative;
      width: 100%;
      height: 52px;
      margin-top: 25px;
      overflow: hidden;
      border: 1px solid rgba(230, 222, 255, .56);
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(108deg, rgba(79, 119, 237, .58), rgba(128, 83, 235, .6) 53%, rgba(173, 64, 222, .56));
      box-shadow: 0 12px 27px rgba(58, 31, 133, .3), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(50, 24, 120, .18);
      backdrop-filter: blur(22px) saturate(1.28);
      -webkit-backdrop-filter: blur(22px) saturate(1.28);
      font-size: 17px;
      font-weight: 620;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .allow::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .31), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    .allow span { position: relative; }
    .allow:active { transform: scale(.98); filter: brightness(.96); }
    .cancel {
      margin-top: 15px;
      padding: 5px 12px;
      border: 0;
      color: rgba(255, 255, 255, .61);
      background: transparent;
      font-size: 14px;
      cursor: pointer;
    }
    .is-requesting .allow { opacity: .66; pointer-events: none; }
    .is-requesting .cancel { visibility: hidden; }
    .is-requesting .close { opacity: .35; pointer-events: none; }
    .is-leaving { opacity: .58; transition: opacity .16s ease; }
    .is-leaving button { pointer-events: none; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (min-width: 403px) { .permission { border-radius: 0; } }
    @media (max-height: 720px) {
      .content { bottom: 20px; }
      .icon { margin-bottom: 11px; transform: scale(.9); }
      h1 { font-size: 23px; }
      p { margin-top: 6px; }
      .allow { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main class="permission" aria-label="开始语音通话前的麦克风授权">
    <div class="artwork" aria-hidden="true"></div>
    <button class="close" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    <section class="content" aria-live="polite">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg></div>
      <h1>打开麦克风，她才能听见你</h1>
      <p>麦克风仅在通话中启用。通话会生成文字记录和摘要，用来延续聊天。</p>
      <button class="allow" type="button"><span>允许麦克风</span></button>
      <button class="cancel" type="button">先不打了</button>
    </section>
  </main>
  <script>
    const permission = document.querySelector('.permission');
    const returnToSource = () => {
      if (permission.classList.contains('is-requesting') || permission.classList.contains('is-leaving')) return;
      permission.classList.add('is-leaving');
      window.setTimeout(() => {
        if (document.referrer && window.history.length > 1) window.history.back();
        else window.location.href = '06-chat-record.html?no-call=1';
      }, 160);
    };
    document.querySelector('.close').addEventListener('click', returnToSource);
    document.querySelector('.cancel').addEventListener('click', returnToSource);
    document.querySelector('.allow').addEventListener('click', (event) => {
      permission.classList.add('is-requesting');
      event.currentTarget.querySelector('span').textContent = '正在请求授权…';
      window.setTimeout(() => { window.location.href = '08-calling.html?flow=1'; }, 320);
    });
  </script>
</body>
</html>
