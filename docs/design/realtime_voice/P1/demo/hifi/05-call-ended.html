<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>林小梦 · 通话结束</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #08070c;
      color: #faf7ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button { font: inherit; }

    .voice-call {
      position: relative;
      isolation: isolate;
      width: min(100vw, 402px);
      height: min(100dvh, 874px);
      min-height: 640px;
      overflow: hidden;
      background: #0a0711;
    }
    .artwork,
    .artwork::after { position: absolute; inset: 0; }
    .artwork {
      z-index: -2;
      background: url('../../../../../../frontend/static/images/Index/Index.png') center top / cover no-repeat;
      filter: brightness(.88) saturate(.93);
      transform: scale(1.015);
      transition: opacity .5s ease, transform .5s ease;
    }
    .artwork::after {
      content: "";
      background: linear-gradient(180deg, rgba(5, 4, 12, .14) 0%, rgba(5, 4, 12, .02) 39%, rgba(5, 4, 12, .13) 60%, rgba(5, 4, 12, .86) 100%);
    }

    .end-content {
      position: absolute;
      right: 0;
      bottom: max(31px, calc(env(safe-area-inset-bottom) + 14px));
      left: 0;
      padding: 0 24px;
      text-align: center;
      transition: transform .42s cubic-bezier(.22, .82, .33, 1), opacity .32s ease;
    }
    .eyebrow {
      margin: 0;
      color: rgba(232, 224, 250, .58);
      font-size: 14px;
      line-height: 19px;
      letter-spacing: .06em;
    }
    time {
      display: block;
      margin: 8px 0 0;
      color: #faf7ff;
      font-size: 48px;
      font-weight: 390;
      line-height: 1;
      letter-spacing: .025em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 5px 24px rgba(0, 0, 0, .38);
    }
    h1 {
      margin: 16px 0 0;
      font-size: 25px;
      font-weight: 620;
      line-height: 1.24;
      letter-spacing: .01em;
    }
    .description {
      margin: 8px 0 0;
      color: rgba(235, 229, 250, .62);
      font-size: 15px;
      line-height: 22px;
      letter-spacing: .01em;
    }
    .return {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 52px;
      margin-top: 25px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(108deg, rgba(79, 119, 237, .56) 0%, rgba(128, 83, 235, .58) 53%, rgba(173, 64, 222, .54) 100%);
      border: 1px solid rgba(231, 224, 255, .58);
      color: #fff;
      font-size: 17px;
      font-weight: 620;
      line-height: 52px;
      letter-spacing: .02em;
      box-shadow: 0 12px 27px rgba(58, 31, 133, .3), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -1px 0 rgba(50, 24, 120, .18);
      backdrop-filter: blur(22px) saturate(1.28);
      -webkit-backdrop-filter: blur(22px) saturate(1.28);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    .return::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 48%;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, .31), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    .return::after {
      content: "";
      position: absolute;
      top: -88%;
      right: 22%;
      width: 18%;
      height: 240%;
      transform: rotate(28deg);
      background: linear-gradient(180deg, transparent 30%, rgba(255, 255, 255, .24) 50%, transparent 70%);
      opacity: .5;
      pointer-events: none;
    }
    .return > span { position: relative; z-index: 1; }
    .return:hover {
      filter: brightness(1.05);
      box-shadow: 0 14px 30px rgba(58, 31, 133, .37), inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -1px 0 rgba(50, 24, 120, .18);
    }
    .return:active { transform: scale(.98); filter: brightness(.96); }
    .return:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .voice-call.is-returning .end-content { transform: translateY(16px); opacity: 0; }
    .voice-call.is-returning .artwork { transform: scale(1.04); opacity: .6; }
    .voice-call.is-returning .return { pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .artwork, .end-content, .return { transition: none; }
    }
    @media (min-width: 403px) { .voice-call { border-radius: 0; } }
    @media (max-height: 720px) {
      .end-content { bottom: 18px; }
      time { font-size: 43px; }
      h1 { margin-top: 12px; font-size: 23px; }
      .return { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main class="voice-call" aria-label="与林小梦的语音通话已结束">
    <div class="artwork" aria-hidden="true"></div>
    <section class="end-content" aria-live="polite">
      <p class="eyebrow">本次通话</p>
      <time datetime="PT5M32S">05:32</time>
      <h1>就先聊到这</h1>
      <p class="description">这次我会记在聊天里。</p>
      <button class="return" type="button"><span>返回聊天</span></button>
    </section>
  </main>
  <script>
    document.querySelector('.return').addEventListener('click', (event) => {
      const button = event.currentTarget;
      button.querySelector('span').textContent = '正在返回聊天…';
      document.querySelector('.voice-call').classList.add('is-returning');
      window.setTimeout(() => { window.location.href = '06-chat-record.html'; }, 320);
    });
  </script>
</body>
</html>
