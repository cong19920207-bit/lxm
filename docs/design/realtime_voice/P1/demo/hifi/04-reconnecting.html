<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>林小梦 · 正在重新连接</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #08070c;
      color: #faf7ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    button { font: inherit; }

    .voice-call {
      position: relative;
      isolation: isolate;
      width: min(100vw, 402px);
      height: min(100dvh, 874px);
      min-height: 640px;
      overflow: hidden;
      background: #0a0711;
    }
    .artwork,
    .artwork::after,
    .atmosphere { position: absolute; inset: 0; }
    .artwork {
      z-index: -3;
      background: url('../../../../../../frontend/static/images/Index/Index.png') center top / cover no-repeat;
      filter: brightness(.68) saturate(.42);
      transform: scale(1.018);
      animation: artwork-breathe 13s ease-in-out infinite alternate;
    }
    .artwork::after {
      content: "";
      background:
        linear-gradient(180deg, rgba(5, 4, 12, .42) 0%, rgba(5, 4, 12, .22) 42%, rgba(5, 4, 12, .42) 61%, rgba(5, 4, 12, .92) 100%),
        radial-gradient(100% 35% at 50% 96%, rgba(10, 11, 33, .68), transparent 70%);
    }
    .atmosphere {
      z-index: -2;
      background: radial-gradient(44% 24% at 49% 60%, rgba(146, 185, 255, .15), transparent 71%);
      pointer-events: none;
      animation: reconnect-light 2.8s ease-in-out infinite;
    }
    .reconnect-character {
      position: absolute;
      z-index: -1;
      top: 34%;
      left: 50%;
      width: 184px;
      height: 206px;
      transform: translateX(-50%);
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .35));
      pointer-events: none;
    }
    .reconnect-character::before {
      content: "";
      position: absolute;
      inset: 18% 12% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 166, 255, .3), rgba(121, 162, 255, .08) 48%, transparent 72%);
      filter: blur(12px);
      animation: character-glow 2.4s ease-in-out infinite;
    }
    .reconnect-character img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: translateY(5px) scale(.97);
      animation: frame-cycle 4.8s ease-in-out infinite;
    }
    .reconnect-character img:nth-child(2) { animation-delay: -3.2s; }
    .reconnect-character img:nth-child(3) { animation-delay: -1.6s; }

    .call-meta {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      text-align: center;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
    }
    .call-meta time {
      display: block;
      font-size: 15px;
      font-weight: 510;
      letter-spacing: .1em;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, .7);
    }

    .presence {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: max(177px, calc(env(safe-area-inset-bottom) + 142px));
      text-align: center;
      text-shadow: 0 5px 20px rgba(0, 0, 0, .54);
    }
    .presence h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
      font-weight: 590;
      letter-spacing: .025em;
    }
    .state {
      margin: 9px 0 0;
      color: rgba(216, 229, 255, .82);
      font-size: 14px;
      line-height: 20px;
      letter-spacing: .018em;
    }
    .note {
      margin: 9px 0 0;
      color: rgba(255, 255, 255, .5);
      font-size: 12px;
      line-height: 17px;
      letter-spacing: .012em;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(43px, calc(env(safe-area-inset-bottom) + 24px));
      display: grid;
      justify-content: center;
    }
    .control {
      width: 60px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, .84);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .control-surface {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 132, 138, .42);
      border-radius: 50%;
      background: #ee5965;
      color: #fff;
      box-shadow: 0 10px 24px rgba(170, 33, 53, .32), inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .18s ease;
    }
    .control-label {
      display: block;
      margin-top: 9px;
      color: rgba(255, 255, 255, .78);
      font-size: 12px;
      line-height: 16px;
      letter-spacing: .01em;
    }
    .control svg { width: 24px; height: 24px; fill: currentColor; }
    .control:active .control-surface { transform: scale(.93); }
    .control:focus-visible .control-surface { outline: 2px solid #fff; outline-offset: 3px; }

    @keyframes artwork-breathe { to { transform: scale(1.035); } }
    @keyframes reconnect-light { 50% { opacity: .35; } }
    @keyframes character-glow { 50% { opacity: .42; transform: scale(.92); } }
    @keyframes frame-cycle {
      0%, 5% { opacity: 0; transform: translateY(5px) scale(.97); }
      12%, 27% { opacity: 1; transform: translateY(0) scale(1); }
      34%, 100% { opacity: 0; transform: translateY(-4px) scale(.98); }
    }
    @media (prefers-reduced-motion: reduce) {
      .artwork, .atmosphere, .reconnect-character::before, .reconnect-character img { animation: none; }
      .reconnect-character img:first-child { opacity: 1; transform: none; }
      .control-surface { transition: none; }
    }
    @media (min-width: 403px) { .voice-call { border-radius: 0; } }
    @media (max-height: 720px) {
      .presence { bottom: 160px; }
      .controls { bottom: 18px; }
    }
  </style>
</head>
<body>
  <main class="voice-call" aria-label="与林小梦的语音通话，正在重新连接">
    <div class="artwork" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="reconnect-character" aria-hidden="true">
      <img src="../assets/q-lxm-signal.png" alt="" />
      <img src="../assets/q-lxm-look.png" alt="" />
      <img src="../assets/q-lxm-wave.png" alt="" />
    </div>

    <header class="call-meta"><time datetime="PT1M18S">01:18</time></header>

    <section class="presence" aria-live="polite">
      <h1>林小梦</h1>
      <p class="state">正在重新连接</p>
      <p class="note">网络有点不稳，正在找回信号</p>
    </section>

    <nav class="controls" aria-label="通话控制">
      <button class="control" type="button" aria-label="挂断通话">
        <span class="control-surface"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9Z"/></svg></span>
        <span class="control-label">挂断</span>
      </button>
    </nav>
  </main>
  <script>
    document.querySelector('.control').addEventListener('click', () => { window.location.href = '05-call-ended.html'; });
  </script>
</body>
</html>
